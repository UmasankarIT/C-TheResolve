services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicresolve_app
    restart: unless-stopped
    depends_on:
      civic-postgres:
        condition: service_healthy
      civic-minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@civic-postgres:5432/civicresolve
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CIVRES_JWT_SECRET: ${CIVRES_JWT_SECRET:-civicresolve-dgp-demo-secret-change-in-prod}
      # Object storage for citizen photos / proof images. The app creates the
      # bucket on first write, so no bootstrap step is needed here.
      S3_ENDPOINT: http://civic-minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-civicresolve}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-miniopassword}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3010:8080"

  civic-postgres:
    image: postgis/postgis:16-3.4
    container_name: civicresolve_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicresolve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civicresolve"]
      interval: 5s
      timeout: 5s
      retries: 5

  civic-redis:
    image: redis:7-alpine
    container_name: civicresolve_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  civic-minio:
    image: minio/minio:latest
    container_name: civicresolve_storage
    restart: unless-stopped
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    # The app declares depends_on: service_healthy for this service, so a
    # missing healthcheck would leave `docker compose up` stuck.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  minio_data:
