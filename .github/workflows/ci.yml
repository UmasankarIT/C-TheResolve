name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # The build must not depend on secrets. NEXT_PUBLIC_* values are
          # inlined at build time, and SESSION_SECRET / GEMINI_API_KEY are only
          # read at runtime, so the build succeeds without them by design --
          # a placeholder is here purely to satisfy any build-time read.
          SESSION_SECRET: ci-build-placeholder-not-a-real-secret
          NEXT_PUBLIC_MINIO_ENDPOINT: http://localhost:9010
